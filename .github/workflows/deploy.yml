name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # The gate must judge pull requests too, or a Dependabot bump auto-merges
  # against no signal at all.
  pull_request:
    branches: [main]
  # So a deploy can be re-run by hand, and so the auto-merge job below can
  # dispatch one. A merge made with GITHUB_TOKEN raises no push event.
  workflow_dispatch:

# NOT a bare `pages`: with cancel-in-progress, a pull-request run would cancel a
# live main deploy.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # GitHub's default is 360 minutes. This job runs in a few minutes; 20 is
    # generous and turns a hung run into a failure instead of a six-hour stall.
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      # The whole suite, not just the browser half. A 2026-08-14 sweep found 29
      # repos whose deploy job ran the accessibility gate alone, so their unit
      # and algorithmic suites never blocked a publish -- they could ship a
      # build whose cryptography was broken so long as the browser specs passed.
      - name: Unit and correctness suite (Vitest)
        run: npm test

      - name: Stamp the artifact with its exact source revision
        run: |
          mkdir -p public
          printf '{"source_sha":"%s","repository":"%s"}\n' "$GITHUB_SHA" "$GITHUB_REPOSITORY" > public/deployment.json

      - name: Build
        run: npm run build

      # NEVER `--with-deps`. That apt step wedged 547 runs across this fleet;
      # the ubuntu-latest image already carries the shared libraries Chromium
      # needs.
      - name: Install Playwright browser
        run: npx playwright install chromium

      - name: Accessibility gate (axe-core, WCAG A/AA)
        run: npm run test:a11y

      - name: Claims suite (does the page tell the truth)
        run: npm run test:claims

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    needs: build
    # NOT `== 'push'`. That also skips workflow_dispatch, which is the one
    # trigger the auto-merge job below depends on: the dispatched run would
    # build, pass the gate, and skip this job, so the site would never update.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
      - name: Verify served Pages bytes match the deployed revision
        env:
          LIVE_URL: https://systemslibrarian.github.io/crypto-lab-return-path/
        run: |
          set -eu
          for attempt in $(seq 1 18); do
            result=$(curl -fsSL --connect-timeout 8 --max-time 15 -H 'Cache-Control: no-cache' "${LIVE_URL}deployment.json?sha=${GITHUB_SHA}" 2>/dev/null || true)
            if node -e 'try { const p=JSON.parse(process.argv[1]);process.exit(p.source_sha===process.argv[2]&&p.repository===process.argv[3]?0:1) } catch { process.exit(1) }' "$result" "$GITHUB_SHA" "$GITHUB_REPOSITORY"; then
              html=$(curl -fsSL --connect-timeout 8 --max-time 15 -H 'Cache-Control: no-cache' "${LIVE_URL}?sha=${GITHUB_SHA}" 2>/dev/null || true)
              if printf '%s' "$html" | grep -Fq 'id="app"'; then
                echo "Verified live HTML and source revision $GITHUB_SHA at $LIVE_URL"
                exit 0
              fi
            fi
            sleep 5
          done
          echo "::error::Live Pages failed source-SHA/HTML verification"
          exit 1

  dependabot-auto-merge:
    # Every gate job. This is the whole safety argument: the gate decides, not
    # the version number. A major that breaks the lab fails the gate and the
    # pull request stays open for a human.
    needs: build
    if: github.event_name == 'pull_request' && github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      # actions: write is required for the deploy dispatch below. Without it
      # `gh workflow run` returns HTTP 403 "Resource not accessible by
      # integration", the merged bump never deploys, and a `|| echo` fallback
      # hides it.
      actions: write
    steps:
      - name: Merge any bump whose gate went green
        run: |
          set -eu
          merged=""
          for attempt in 1 2 3; do
            if gh pr merge --squash --delete-branch "$PR_URL"; then
              merged=1
              break
            fi
            echo "merge attempt $attempt failed; base branch may have moved - retrying"
            sleep 15
          done
          if [ -z "$merged" ]; then
            echo "::error::gate passed but the merge did not land after 3 attempts; the bump is unmerged and no deploy was dispatched"
            exit 1
          fi
          # A merge made with GITHUB_TOKEN raises no push event -- GitHub suppresses
          # them so workflows cannot retrigger themselves -- so deploy would never run
          # and the site would keep serving the previous build. Ask for it explicitly;
          # a workflow_dispatch through the API is not suppressed. The dispatched run
          # is the same gate-then-deploy pipeline, so a bad merge still ships nothing.
          #
          # Dispatch the file THIS lab has: most are deploy.yml, some deploy-pages.yml
          # or pages.yml. A copied name 404s only on the auto-merge path, after the
          # merge has landed. See §6.2.
          gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY" --ref main
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
